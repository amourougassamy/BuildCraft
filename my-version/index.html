<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildCraft 3D — Engineering Challenge</title><style>body{margin:0;background:#0b1220;color:#eef4ff;font:14px system-ui}header{padding:14px 20px;background:#17243a;display:flex;justify-content:space-between}main{display:grid;grid-template-columns:260px 1fr 265px;height:calc(100vh - 55px)}aside{padding:17px;background:#132035;overflow:auto}#view{position:relative;min-width:0}button,select,input{margin:5px 0;padding:9px;border:1px solid #435571;border-radius:7px;background:#233852;color:white;width:100%;box-sizing:border-box}button{cursor:pointer}button:hover{background:#315b86}.primary{background:#137f75}h3{color:#6de2cb}label{display:block;margin-top:10px}small{color:#b8c8dc}#score{font-size:32px;color:#6de2cb}#hint{position:absolute;bottom:12px;left:12px;background:#12233bc9;padding:10px;border-radius:8px}#status{line-height:1.6}canvas{display:block} @media(max-width:850px){main{grid-template-columns:190px 1fr}aside:last-child{grid-column:1/-1;height:200px}}</style></head><body><header><strong>🏗️ BuildCraft 3D · Version 3 Web Edition</strong><span>Design · Test · Compete</span></header><main><aside><h3>Construct</h3><label>Template</label><select id="preset"><option value="tower">Tower</option><option value="house">House</option><option value="bridge">Bridge</option><option value="frame">Frame</option></select><button onclick="presetBuild()">Load Template</button><label>Element</label><select id="element"><option value="column">Column</option><option value="beam">Beam</option><option value="slab">Slab</option><option value="brace">Brace</option><option value="wall">Wall</option></select><label>Material</label><select id="material"><option>Steel</option><option>Concrete</option><option>Timber</option></select><button onclick="add()">+ Add Element</button><button onclick="undo()">↶ Undo</button><button onclick="clearBuild()">Clear</button><h3>Share</h3><button onclick="save()">Export Design JSON</button><input type="file" id="importer" accept=".json" onchange="loadFile(event)"><small>Orbit: drag · Zoom: scroll</small></aside><div id="view"><div id="hint">Drag to orbit · Scroll to zoom</div></div><aside><h3>Loads</h3><div id="loads"></div><label>Combination</label><select id="combo"><option value="service">D + L</option><option value="wind">D + L + W</option><option value="seismic">D + 0.5L + E</option><option value="snow">D + L + S</option><option value="thermal">D + L + T</option><option value="all">All loads</option></select><button class="primary" onclick="test()">▶ Run Load Simulation</button><button onclick="animateToggle()">Animate Deformation</button><h3>Engineering Dashboard</h3><div id="score">—</div><div id="status">Build a structure and run a simulation.</div><small>Educational approximation only. Not suitable for actual engineering design.</small></aside></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1220);const camera=new THREE.PerspectiveCamera(55,1,.1,1000);camera.position.set(17,15,22);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.querySelector('#view').prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,5,0);controls.update();scene.add(new THREE.HemisphereLight(0xffffff,0x41536b,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(10,25,10);scene.add(light);scene.add(new THREE.GridHelper(60,60,0x47637b,0x24384b));const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x101e30}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;scene.add(ground);let parts=[],meshes=[],playing=false,force=0;const colors={Steel:0x62c9f5,Concrete:0xb0bdc9,Timber:0xe9a65d};function box(x,y,z,w,h,d,type='column',mat='Steel'){parts.push({x,y,z,w,h,d,type,mat})}function renderParts(){meshes.forEach(m=>scene.remove(m));meshes=[];for(const p of parts){const m=new THREE.Mesh(new THREE.BoxGeometry(p.w,p.h,p.d),new THREE.MeshStandardMaterial({color:colors[p.mat],roughness:.6}));m.position.set(p.x,p.y,p.z);m.userData.y=p.y;m.userData.x=p.x;scene.add(m);meshes.push(m)}}function frame(levels=3,width=8,depth=8){for(let i=0;i<=levels;i++){let y=i*3;for(let x of [-width/2,width/2])for(let z of [-depth/2,depth/2])if(i<levels)box(x,y+1.5,z,.4,3,.4);if(i){box(0,y,0,width+.6,.22,depth+.6,'slab','Concrete');for(let z of [-depth/2,depth/2])box(0,y,z,width,.35,.35,'beam');for(let x of [-width/2,width/2])box(x,y,0,.35,.35,depth,'beam')}}}window.presetBuild=()=>{parts=[];const v=document.querySelector('#preset').value;if(v==='tower')frame(8,7,7);if(v==='house')frame(2,9,7);if(v==='frame')frame(3,9,7);if(v==='bridge'){for(let x=-12;x<=12;x+=6){box(x,2,0,.6,4,.6);box(x,2,5,.6,4,.6)}box(0,4.2,2.5,26,.4,7,'slab','Concrete');for(let x=-12;x<12;x+=6)box(x+3,3,0,8,.3,.3,'brace')}renderParts();document.querySelector('#score').textContent='—'};window.add=()=>{const t=document.querySelector('#element').value,mat=document.querySelector('#material').value;const n=parts.length;const x=((n%5)-2)*2.2,z=(Math.floor(n/5)%5-2)*2.2,y=1.5+Math.floor(n/25)*3;if(t==='column')box(x,y,z,.4,3,.4,t,mat);if(t==='beam')box(x,y,z,3,.4,.4,t,mat);if(t==='slab')box(x,y,z,3,.25,3,t,mat);if(t==='wall')box(x,y,z,3,3,.2,t,mat);if(t==='brace')box(x,y,z,.3,3,.3,t,mat);renderParts()};window.undo=()=>{parts.pop();renderParts()};window.clearBuild=()=>{parts=[];renderParts()};const labels=[['Dead','D'],['Live','L'],['Seismic','E'],['Wind','W'],['Snow','S'],['Thermal','T']];document.querySelector('#loads').innerHTML=labels.map(([n,k])=>'<label>'+n+' ('+k+') <output id="o'+k+'">50</output>%</label><input type="range" id="'+k+'" min="0" max="100" value="50" oninput="document.getElementById(\'o'+k+'\').textContent=this.value">').join('');window.test=()=>{if(!parts.length){document.querySelector('#status').textContent='Add a structure first.';return}const a=Object.fromEntries(labels.map(([,k])=>[k,+document.getElementById(k).value/100]));const c=document.querySelector('#combo').value;const active={service:['D','L'],wind:['D','L','W'],seismic:['D','L','E'],snow:['D','L','S'],thermal:['D','L','T'],all:['D','L','E','W','S','T']}[c];const demand=active.reduce((s,k)=>s+a[k]*(k==='E'||k==='W'?1.5:1),0);const columns=parts.filter(p=>p.type==='column').length,braces=parts.filter(p=>p.type==='brace').length,slabs=parts.filter(p=>p.type==='slab').length;const capacity=1+columns*.16+braces*.22+parts.length*.015;const ratio=demand/capacity;force=Math.min(.65,ratio*.14);const score=Math.max(0,Math.round(100-38*ratio-Math.max(0,slabs-columns)*2));document.querySelector('#score').textContent=score+'/100';document.querySelector('#status').innerHTML='Elements: '+parts.length+'<br>Demand/capacity index: '+ratio.toFixed(2)+'<br>Approximate stability: '+(ratio<1?'PASS':'REVIEW')+'<br>Material efficiency: '+Math.round(100*columns/Math.max(1,parts.length))+'%<br>Animation is visually exaggerated.';playing=true};window.animateToggle=()=>playing=!playing;window.save=()=>{const blob=new Blob([JSON.stringify({version:3,parts},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='buildcraft-design.json';a.click();URL.revokeObjectURL(a.href)};window.loadFile=e=>{const f=e.target.files[0];if(!f)return;f.text().then(s=>{try{const d=JSON.parse(s);if(!Array.isArray(d.parts))throw Error();parts=d.parts.filter(p=>['x','y','z','w','h','d','mat'].every(k=>k in p));renderParts()}catch{alert('Invalid design JSON')}})};function resize(){const el=document.querySelector('#view');camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight)}window.addEventListener('resize',resize);resize();let tick=0;function loop(){requestAnimationFrame(loop);tick+=.025;meshes.forEach(m=>{m.position.x=m.userData.x+(playing?Math.sin(tick)*force*(m.userData.y/10):0);m.position.y=m.userData.y+(playing?Math.sin(tick*1.7)*force*.1:0)});controls.update();renderer.render(scene,camera)}presetBuild();loop();
</script></body></html>
