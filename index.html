<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuildCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
  :root { --ink: #3a3340; --muted: #7a7180; --card: #fffdf9; --red: #e8655a; --green: #5cb85c; --blue: #5b9bd5;
    --clay: inset -5px -6px 10px rgba(60, 40, 30, .08), inset 5px 6px 10px rgba(255, 255, 255, .85), 0 10px 22px rgba(90, 60, 50, .16); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(170deg, #cfe9ff 0%, #fdeedd 55%, #ffd8be 100%) fixed; }
  main { width: 100%; max-width: 560px; text-align: center; background: var(--card); border-radius: 28px; box-shadow: var(--clay); padding: 32px 24px; }
  h1 { font-size: clamp(44px, 12vw, 64px); margin: 0; line-height: 1; }
  h1 span { color: var(--red); }
  .tag { font-size: 19px; color: var(--muted); margin: 10px 0 22px; }
  .worker { font-size: 72px; }
  a.btn { display: block; text-decoration: none; color: #fff; font-weight: 600; font-size: 22px; border-radius: 20px; padding: 14px 18px; margin: 12px 0;
    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .15), inset 0 3px 0 rgba(255, 255, 255, .35), 0 6px 12px rgba(60, 40, 60, .18); transition: transform .12s; }
  a.btn:hover, a.btn:focus-visible { transform: translateY(-2px) scale(1.02); }
  .play { background: var(--green); font-size: 26px; }
  .board { background: var(--blue); }
  .small { font-size: 14px; color: var(--muted); margin-top: 18px; }
</style>
</head>
<body>
<main>
  <div class="worker">👷‍♀️</div>
  <h1>Build<span>Craft</span></h1>
  <p class="tag">Design it. Build it. Survive the year!</p>
  <a class="btn play" href="master-v1/">▶ Play BuildCraft</a>
  <a class="btn board" href="master-v1/leaderboard.html">🏆 Leaderboard</a>
  <p class="small">Made at the NCSEA Hackathon 2026. A game, not engineering: every number in it is made up to teach the big ideas.</p>
</main>
</body>
</html>
