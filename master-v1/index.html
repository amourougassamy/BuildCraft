<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuildCraft Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }
</script>
</head>
<body>
<header id="hud" hidden>
  <div class="logo">Build<span>Craft</span></div>
  <div class="chip" id="nameChip">👷 <b id="nameText"></b></div>
  <div class="chip jarChip" id="jarChip" title="Coins in your jar">
    <svg class="jar" viewBox="0 0 60 72" aria-hidden="true">
      <rect x="14" y="2" width="32" height="9" rx="4" fill="#c9a26b"/>
      <path d="M12 14 h36 q6 0 6 8 v38 q0 10 -10 10 h-28 q-10 0 -10 -10 v-38 q0 -8 6 -8 z" fill="rgba(200,230,255,.55)" stroke="#8aa4b8" stroke-width="2.5"/>
      <g id="jarCoins"></g>
      <path d="M16 20 q-3 14 0 34" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
    </svg>
    <div><b id="coinCount">0</b><small> coins</small></div>
  </div>
  <div class="chip" id="ecoChip" title="Eco points">🌱 <b id="ecoCount">0</b></div>
  <div class="chip happyChip" id="happyChip" title="Happiness"><span id="face">😀</span><div class="meter"><i id="happyFill"></i></div></div>
  <div class="hudBtns">
    <button class="iconBtn" id="mapBtn" title="World map">🗺️</button>
    <button class="iconBtn" id="gentleBtn" title="Gentle mode: no ghosts">👻</button>
    <button class="iconBtn" id="soundBtn" title="Sound on/off">🔊</button>
  </div>
</header>

<!-- 1. Title: ask for the builder's name -->
<section id="title" class="screen">
  <div class="titleCard clay">
    <div class="bigLogo">Build<span>Craft</span></div>
    <p class="tag">Design it. Build it. Survive the year!</p>
    <div class="fran big">👷‍♀️</div>
    <form id="nameForm">
      <label for="nameInput">What's your name, builder?</label>
      <input id="nameInput" maxlength="16" autocomplete="off" placeholder="Type your name" required>
      <button class="btn go" type="submit">Let's build! 🏗️</button>
    </form>
    <p class="small" id="welcomeBack"></p>
  </div>
</section>

<!-- 2. World map -->
<section id="mapScreen" class="screen" hidden>
  <div id="mapView" class="view"></div>
  <div class="mapHint clay">👆 Drag to look around · tap a site to play</div>
  <aside id="siteCard" class="clay" hidden></aside>
</section>

<!-- 4 + 5. Design and run share one screen -->
<section id="play" class="screen" hidden>
  <div class="stageCol">
    <div class="clay stage">
      <div id="siteView" class="view"></div>
      <div id="banner" hidden></div>
      <div id="openBadge" class="pill"></div>
      <button id="peekBtn" class="iconBtn peek" title="Peek inside: see-through walls">👀</button>
      <button id="fixPop" class="btn repair" hidden>🔧 Fix it!</button>
    </div>
    <div class="clay status">
      <div class="row">
        <span id="phase"></span>
        <button class="btn go" id="runBtn">▶ Run the year!</button>
        <button class="btn ff" id="ffBtn" hidden>⏩ 1×</button>
        <button class="btn pause" id="pauseBtn" hidden>⏸</button>
      </div>
      <div class="months" id="months"></div>
    </div>
    <div class="clay mascot">
      <div class="fran">👷‍♀️</div>
      <div class="bubble" id="say"></div>
    </div>
  </div>
  <div class="panel" id="panel"></div>
</section>

<div class="overlay" id="overlay" hidden><div class="clay sheet" id="sheet"></div></div>

<p class="foot">A game, not engineering: every number here is made up to teach the big ideas.</p>

<script src="js/fx.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
